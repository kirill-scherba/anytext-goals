<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <base href="{{.Prefix}}/" />
  <title>Цели</title>
  <style>{{.Style}}</style>
</head>
<body>
  <header>
    <span class="name">Цели</span>
    <span class="badges" id="badges"></span>
    <button type="button" class="text" id="refresh" title="Перечитать">⟳</button>
  </header>

  <main>
    <p class="hint" id="error" hidden></p>

    <!-- Two tabs: goals and deeds are different rhythms (weeks against days), and a list at the bottom
         of the other one is how deeds went unnoticed (27.11.2026). -->
    <nav class="tabs" id="tabs">
      <button type="button" data-tab="goals" class="active">Цели <span class="count" id="count-goals"></span></button>
      <button type="button" data-tab="deeds">Дела <span class="count" id="count-deeds"></span></button>
    </nav>

    <section id="tab-goals">
      <div class="section-head">
        <h2>Цели</h2>
        <select id="goal-filter">
          <option value="active">активные</option>
          <option value="paused">на паузе</option>
          <option value="done">закрытые</option>
          <option value="all">все</option>
        </select>
        <button type="button" class="text" id="new-goal">+ Цель</button>
      </div>

      <form id="goal-form" class="card" hidden>
        <input id="goal-title" placeholder="чего хотите достичь" maxlength="160" />
        <input id="goal-deadline" type="date" title="срок" />
        <input id="goal-priority" type="number" min="0" max="10" placeholder="приоритет" />
        <textarea id="goal-description" rows="2" placeholder="описание (необязательно)"></textarea>
        <div class="row">
          <button type="submit" class="primary">Сохранить</button>
          <button type="button" class="text" id="goal-cancel">Отмена</button>
        </div>
      </form>

      <ul class="goals" id="goals"></ul>
      <p class="empty" id="goals-empty" hidden>Целей нет.</p>
      <p class="stale" id="stale" hidden></p>
    </section>

    <section id="tab-deeds" hidden>
      <div class="section-head">
        <h2>Дела</h2>
        <label class="check"><input type="checkbox" id="show-done" /> показывать закрытые</label>
      </div>

      <form id="deed-form" class="row">
        <input id="deed-text" placeholder="что сделать — и Enter" maxlength="240" />
        <input id="deed-due" type="date" title="срок" />
        <select id="deed-goal" title="какую цель двигает"></select>
      </form>

      <ul class="deeds" id="deeds"></ul>
      <p class="empty" id="deeds-empty" hidden>Дел нет.</p>
    </section>
  </main>

  <footer>
    <span id="status">…</span>
  </footer>
  <script>{{.Script}}</script>
</body>
</html>
